<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tara Rose Content Planner</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Figtree:wght@400;500;600;700&family=Jost:wght@300;400&display=swap">
<style>
/* Read-only website version of the Tara Rose content planner (data from data/posts.json, exported from the Claude planner).
   Tara Rose 2026 look: black and charcoal grounds, white type, one mint accent. Deliberately dark-only. */
:root{
  --bg:#0e0e0e; --surface:#181818; --raise:#202020; --line:#2e2e2e; --line-strong:#454545;
  --ink:#f5f4f1; --muted:#a6a5a1; --mint:#c2f0de; --mint-ink:#0d1a15; --mint-dim:rgba(194,240,222,.14);
  --warn:#f2c088;
  --serif:"Playfair Display","Didot","Bodoni 72",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mark:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:calc(28px + env(safe-area-inset-top,0px)) 60px}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}
.brandrow{flex:1 1 100%;display:flex;justify-content:center;padding-bottom:8px}
.lockup{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--mark);font-weight:300;text-transform:uppercase;line-height:1}
.lockup .rule{width:34%;height:2px;background:var(--mint);margin-bottom:9px}
.lockup .name{font-size:22px;letter-spacing:.32em;padding-left:.32em}
.lockup .salon{font-size:9.5px;letter-spacing:.42em;padding-left:.42em;margin-top:7px;color:var(--muted)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.08;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--mint)}
.sub{color:var(--muted);font-size:14px;margin:0}
button,.btn{font:inherit;font-weight:600;font-size:14.5px;min-height:44px;cursor:pointer;border-radius:999px;padding:9px 16px;border:1px solid transparent;background:var(--mint);color:var(--mint-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
button.ghost:hover,.btn.ghost:hover{border-color:var(--mint);color:var(--mint)}
button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-size:14px;color:var(--muted)}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:620px){.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pstep{flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px 14px;min-height:62px}
.pstep .pl{font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pstep .pn{font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.pstep[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-dim)}
.pstep[aria-pressed="true"] .pl{color:var(--mint)}
.viewsw{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;width:fit-content}
.viewsw button{background:transparent;color:var(--muted);border:0;padding:8px 16px}
.viewsw button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{font-family:var(--mark);font-weight:400;font-size:11px;opacity:.75;margin-left:2px}
.profile{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mark);font-size:10px;letter-spacing:.18em;padding-left:.18em;flex:none}
.handle{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;max-width:520px}
.tile{position:relative;aspect-ratio:var(--ratio,3/4);max-width:100%;border:0;padding:0;border-radius:0;overflow:hidden;background:var(--raise);color:#fff;display:block;width:100%;min-height:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .st{position:absolute;left:6px;top:6px;font-family:var(--mark);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,10,10,.72);color:#fff;padding:3px 7px;border-radius:999px}
.tile .st.scheduled,.tile .st.posted{background:var(--mint);color:var(--mint-ink)}
.tile .when{position:absolute;left:0;right:0;bottom:0;padding:22px 7px 6px;font-size:11px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.72));text-align:left;font-variant-numeric:tabular-nums}
.tile .kind{position:absolute;right:6px;bottom:28px;font-size:10px;font-family:var(--mark);letter-spacing:.12em;background:rgba(10,10,10,.72);padding:2px 6px;border-radius:999px}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-size:11.5px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--raise) 0 10px,var(--surface) 10px 20px)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;grid-column:1/-1}
.empty .big{font-family:var(--serif);font-size:1.35rem;color:var(--ink);margin-bottom:6px}
.empty .big em{color:var(--mint)}
label{display:block;font-family:var(--mark);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;margin-bottom:7px}
select{font:inherit;font-size:15.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:240px;max-width:100%}
.packbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.pack-head{display:flex;flex-direction:column;gap:6px;padding:22px 0 6px}
.eyebrow{font-family:var(--mark);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mint)}
.pack-head h2{font-family:var(--serif);font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0;font-weight:500}
.packlist{display:flex;flex-direction:column;gap:18px}
.creative{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0;scroll-margin-top:16px}
.creative.flash{border-color:var(--mint)}
.cr-top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:640px){.cr-top{grid-template-columns:96px minmax(0,1fr)}.creative{padding:16px}}
.cr-top img,.cr-top .noimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--raise)}
.cr-title{font-family:var(--serif);font-size:1.45rem;line-height:1.2;margin:4px 0 8px;word-break:break-word}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-family:var(--mark);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted)}
.pill.approved{color:var(--warn);border-color:var(--warn)}
.pill.scheduled,.pill.posted{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.strategy{font-size:14px;color:var(--muted);border-left:2px solid var(--mint);padding-left:10px;margin:10px 0 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;margin:12px 0 0}
.kv dt{font-family:var(--mark);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;min-width:0;word-break:break-word}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;max-width:220px}
.meter>div{height:100%;background:var(--mint)}
.cr-prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.plat{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.plat.isdone .copybox,.plat.isdone .gbp-grid{opacity:.55}
.plat-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.plat-h h3{margin:0;font-family:var(--mark);font-weight:400;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.copybox{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.65;margin:0}
.copybox .seg{display:block;font-family:var(--mark);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin:0 0 2px}
.copybox .tags{color:var(--muted)}
.gbp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gbp-grid{grid-template-columns:minmax(0,1fr)}}
.gbp-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gbp-card .bt{font-family:var(--mark);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint)}
.gbp-card .tt{font-weight:700}
.gbp-card .bd{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.count{font-size:12px;color:var(--muted)}
.footer-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.footer-card h4{margin:0 0 6px;font-family:var(--mark);font-weight:400;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint)}
.footer-card p{margin:0;font-size:14px;color:var(--muted)}
[hidden]{display:none!important}
/* campaign calendar */
.camp-head{display:flex;flex-direction:column;gap:8px;padding:18px 0 4px}
.camp-month{display:flex;align-items:center;gap:12px}
.camp-month h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,3.6vw,2.3rem);margin:0;text-transform:none;letter-spacing:0;color:var(--ink);min-width:0}
.camp-month button{padding:6px 14px}
.camp-themes{display:flex;flex-wrap:wrap;gap:6px}
.theme{font-size:12.5px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;color:var(--muted)}
.theme b{color:var(--mint);font-weight:600;margin-right:4px}
.camp-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
@media (max-width:620px){.camp-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cstat{flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px 14px;min-height:62px}
.cstat .pl{font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.cstat .pn{font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.cstat.on{border-color:var(--mint);background:var(--mint-dim)}
.cstat.s-blocked .pl{color:var(--warn)}
.camp-next{margin-top:12px;background:var(--raise);border-left:4px solid var(--mint);border-radius:10px;padding:10px 14px;font-size:15px}
.camp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.camp-bar select{width:auto;min-width:160px;padding:9px 12px;font-size:14.5px}
.viewsw.sm button{padding:6px 14px;min-height:38px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:4px;min-width:840px}
.cdow{font-family:var(--mark);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.cday{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:110px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cday.off{background:transparent;border-color:transparent}
.cday.today{border-color:var(--mint)}
.cday.empty-day{opacity:.55}
.cd-n{font-weight:700;font-size:13px;color:var(--muted)}
.cday.today .cd-n{color:var(--mint)}
.citem{display:flex;flex-wrap:wrap;align-items:flex-start;gap:3px 5px;width:100%;min-height:0;padding:5px 7px;border-radius:7px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--line-strong);font-size:12px;font-weight:600;text-align:left;line-height:1.3}
.citem .ci-t{flex:1 1 calc(100% - 22px);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.citem .ci-f{color:var(--muted);flex:none}
.citem .ci-b{flex:none;font-size:10px;background:var(--warn);color:#2a1a05;border-radius:99px;padding:0 6px;margin-left:17px}
.citem.s-done{border-left-color:var(--mint);opacity:.6}
.citem.s-ready{border-left-color:var(--mint)}
.citem.s-blocked{border-left-color:var(--warn)}
.agenda{display:flex;flex-direction:column;gap:10px}
.aweek{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--mint-dim);font-size:14px}
.aweek b{color:var(--mint);margin-right:6px}
.aday{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:620px){.aday{grid-template-columns:minmax(0,1fr)}}
.ad-d{font-weight:700;font-size:14px;padding-top:12px}
.aday.today .ad-d{color:var(--mint)}
.ad-items{display:flex;flex-direction:column;gap:6px;min-width:0}
.arow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:400}
.arow:hover{border-color:var(--line-strong)}
.ar-s{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid var(--line-strong);color:var(--muted)}
.arow.s-done .ar-s{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
.arow.s-ready .ar-s{color:var(--mint);border-color:var(--mint)}
.arow.s-blocked{border-color:rgba(242,192,136,.6)}
.arow.s-blocked .ar-s{background:var(--warn);color:#2a1a05;border-color:var(--warn)}
.arow.s-done .ar-t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.ar-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ar-t{font-weight:700;font-size:15px}
.ar-m{font-size:13px;color:var(--muted)}
.ar-b{font-size:13px;color:var(--warn);font-weight:600}
.ar-st{font-size:12px;color:var(--muted);text-align:right;max-width:160px}
@media (max-width:620px){.arow{grid-template-columns:26px minmax(0,1fr)}.ar-st{grid-column:2;text-align:left;max-width:none}}
.camp-detail{margin-top:14px}
.cdet{background:var(--surface);border:1px solid var(--mint);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.cdet.s-blocked{border-color:var(--warn)}
.cdet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cdet-x{padding:4px 12px;min-height:36px}
.kv dd.blk{color:var(--warn);font-weight:600}
.pill.st-blocked{color:var(--warn);border-color:var(--warn)}
.pill.st-done,.pill.st-ready{color:var(--mint);border-color:var(--mint)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.ctable{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
.ctable th{text-align:left;font-family:var(--mark);font-weight:400;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:12px 12px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.ctable td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ctable tr.tr{cursor:pointer}
.ctable tr.tr:hover td,.ctable tr.tr:focus td{background:var(--raise)}
.ctable tr.tr:focus{outline:2px solid var(--mint);outline-offset:-2px}
.ctable tr.tr.today td:first-child{box-shadow:inset 3px 0 0 var(--mint)}
.ctable tr.tw td{background:var(--mint-dim);font-size:13px;padding:8px 12px}
.ctable tr.tw b{color:var(--mint);margin-right:6px}
.ctable tr.tn td{padding-top:0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.ctable tr.tr:has(+ tr.tn) td{border-bottom:0}
.ctable tr.tn.blk td{color:var(--warn);font-weight:600}
.ctable tr.s-done .td-t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.td-d{white-space:nowrap;font-weight:600}
.td-f{white-space:nowrap}
.td-t{font-weight:700;min-width:220px}
.td-s{white-space:nowrap;color:var(--muted)}
.pchip{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;margin:0 3px 3px 0;white-space:nowrap}
.tpill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line-strong);color:var(--muted)}
.tpill.st-done{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.tpill.st-ready{color:var(--mint);border-color:var(--mint)}
.tpill.st-blocked{background:var(--warn);border-color:var(--warn);color:#2a1a05}
.mapping{display:flex;flex-wrap:wrap;gap:6px}
.mapping span{font-size:12.5px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px}
.mapping b{color:var(--mint);font-weight:600}
.camp-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.camp-tools select{min-width:240px}
.viewsw button{white-space:nowrap}
@media (max-width:420px){.viewsw button{padding:8px 11px;font-size:13.5px}}

.pi{display:inline-flex;width:20px;height:20px;flex:none}
.pi svg{width:100%;height:100%;display:block}
.tab{display:inline-flex;align-items:center;gap:8px}
.chip .pi,.subtab .pi{width:16px;height:16px}
.plat-h h3{display:inline-flex;align-items:center;gap:8px}
.prow .pn{display:inline-flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow"><div class="lockup" aria-label="Tara Rose Salon"><span class="rule"></span><span class="name">Tara Rose</span><span class="salon">Salon</span></div></div>
    <div>
      <h1>Content <em>planner</em></h1>
      <p class="sub" id="updated">Loading the latest plan…</p>
    </div>
  </header>

  <div class="notice">Read-only view. To change captions, sync Drive or approve posts, use the Content planner in Claude.</div>
  <div class="pipeline" id="pipeline" role="group" aria-label="Filter by status"></div>
  <div class="viewsw" role="group" aria-label="View"><button id="vGrid" aria-pressed="true">Grids</button><button id="vPack" aria-pressed="false">Caption pack</button><button id="vCamp" aria-pressed="false">Campaign</button></div>

  <section id="gridView">
    <div class="tabs" role="tablist" aria-label="Platform" id="tabs"></div>
    <div class="profile" style="margin-top:16px"><div class="avatar" aria-hidden="true">TRS</div><div><div class="handle" id="handle"></div><div class="sub" id="gridSub"></div></div></div>
    <div class="grid" id="grid"></div>
    <p class="sub" style="margin-top:10px">Tap a post to see its complete captions.</p>
  </section>

  <section id="campView" hidden>
    <div class="camp-tools"><div><label for="campSel">Campaign</label><select id="campSel"></select></div><a class="btn ghost" href="data/campaign-sample.csv" download="tara-rose-campaign-sample.csv">Download sample CSV</a></div>
    <div id="camp"></div>
  </section>

  <section id="packView" hidden>
    <div class="packbar">
      <div><label for="weekSel">Week</label><select id="weekSel"></select></div>
      <button class="ghost" id="packCopy">Copy whole pack</button>
    </div>
    <div id="pack"></div>

/* ---------- campaign calendar (shared by the Claude planner and the website) ---------- */
const CAMP=(()=>{
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  function parseCSV(text){
    const rows=[]; let row=[], cell="", q=false;
    text=String(text||"").replace(/^﻿/,"");
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
      else if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell=""; }
      else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell+=c;
    }
    if(cell!==""||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(x=>String(x).trim()!==""));
  }

  function parseDate(s,year){
    s=String(s||"").trim(); if(!s) return "";
    let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return iso(+m[1],+m[2],+m[3]);
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/); if(m){ let y=m[3]?+m[3]:year; if(y<100) y+=2000; return iso(y,+m[2],+m[1]); }
    const t=s.toLowerCase().replace(/(\d)(st|nd|rd|th)\b/g,"$1").replace(/[,]/g," ");
    let d=t.match(/\b(\d{1,2})\s+([a-z]{3,})\b(?:\s+(\d{4}))?/), mon, day, y;
    if(d&&MONTHS.includes(d[2].slice(0,3))){ day=+d[1]; mon=MONTHS.indexOf(d[2].slice(0,3))+1; y=d[3]?+d[3]:year; }
    else { d=t.match(/\b([a-z]{3,})\s+(\d{1,2})\b(?:\s+(\d{4}))?/); if(d&&MONTHS.includes(d[1].slice(0,3))){ mon=MONTHS.indexOf(d[1].slice(0,3))+1; day=+d[2]; y=d[3]?+d[3]:year; } }
    return mon&&day?iso(y,mon,day):"";
  }
  const iso=(y,m,d)=>(m<1||m>12||d<1||d>31)?"":`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  const PLAT=[[/^ig\s*story|instagram\s*story/i,"IG Story"],[/^fb\s*story|facebook\s*story/i,"FB Story"],[/^(ig|insta|instagram)$/i,"Instagram"],[/^(fb|facebook)$/i,"Facebook"],
    [/^tik\s*tok$/i,"TikTok"],[/^(yt|youtube)(\s*shorts)?$/i,"YouTube Shorts"],[/^(gbp|google( business( profile)?)?|gmb)$/i,"Google Business"],[/^(li|linkedin)$/i,"LinkedIn"],[/^reddit$/i,"Reddit"],[/^(x|twitter)$/i,"X"]];
  const normPlat=p=>{ p=p.trim(); for(const [re,n] of PLAT) if(re.test(p)) return n; return p; };

  function statusGroup(v){
    v=String(v||"").toLowerCase();
    if(!v) return "";
    if(/posted|published|live|done|complete/.test(v)) return "done";
    if(/await|block|tbc|on hold|stuck/.test(v)) return "blocked";
    if(/ready|written|approved|scheduled|final/.test(v)) return "ready";
    return "todo";
  }
  function find(headers,res,skip=[]){ for(const re of res){ const i=headers.findIndex((h,ix)=>re.test(h)&&!skip.includes(ix)); if(i>=0) return i; } return -1; }

  function fromCSV(text,{name="",year=new Date().getFullYear()}={}){
    const rows=parseCSV(text); if(rows.length<2) throw new Error("The file has no rows under the header.");
    let hi=rows.findIndex(r=>r.some(c=>/date/i.test(c))); if(hi<0) hi=0;
    const H=rows[hi].map(h=>String(h).trim()), L=H.map(h=>h.toLowerCase());
    const col={date:find(L,[/^date$/,/date/]),day:find(L,[/^day$/]),week:find(L,[/^week/]),format:find(L,[/^format/,/format|type/]),
      platforms:find(L,[/platform|channel|network/]),cta:find(L,[/cta|call to action/]),link:find(L,[/link|url|reference/]),notes:find(L,[/^notes?$/,/note|comment/])};
    col.title=find(L,[/title|asset|post|topic|creative|content|caption/],[col.date,col.platforms,col.link,col.notes].concat(L.map((h,i)=>/status/.test(h)?i:-1)));
    col.pillar=find(L,[/pillar/,/phase|theme|campaign|category/],[col.title]);
    if(col.date<0) throw new Error("No Date column found. Add a column called Date.");
    const statusCols=L.map((h,i)=>/status/.test(h)?i:-1).filter(i=>i>=0);
    const used=new Set([...Object.values(col),...statusCols].filter(i=>i>=0));
    const get=(r,i)=>i>=0?String(r[i]??"").trim():"";
    const items=[], weeks=[]; let wk=null;
    rows.slice(hi+1).forEach((r,n)=>{
      const date=parseDate(get(r,col.date),year);
      if(!date){
        const cells=r.map(x=>String(x).trim()).filter(Boolean); if(!cells.length) return;
        wk={label:get(r,col.week)||cells[0],theme:get(r,col.title)||(cells[1]||""),notes:get(r,col.notes)};
        if(wk.theme===wk.label) wk.theme=cells[1]||""; weeks.push(wk); return;
      }
      const statuses=statusCols.map(i=>({name:H[i],value:get(r,i)})).filter(s=>s.value);
      const notes=get(r,col.notes);
      const blocked=/\bblocker\b/i.test(notes)&&!/\bunblocked\b/i.test(notes);
      const groups=statuses.map(s=>statusGroup(s.value));
      const state=blocked||groups.includes("blocked")?"blocked":groups.length&&groups.every(g=>g==="done")?"done":groups.length&&groups.every(g=>g==="done"||g==="ready")?"ready":groups.length?"todo":"";
      const extra={}; H.forEach((h,i)=>{ if(!used.has(i)&&get(r,i)) extra[h||`Column ${i+1}`]=get(r,i); });
      items.push({id:`r${n}`,date,day:get(r,col.day),format:get(r,col.format),title:get(r,col.title)||"(untitled)",pillar:get(r,col.pillar),
        platforms:get(r,col.platforms).split(/[,;\/|]+/).map(normPlat).filter(Boolean),statuses,state,blocked,cta:get(r,col.cta),link:get(r,col.link),notes,week:wk?wk.label:"",extra});
    });

    const mapping={}; [["Date","date"],["Day","day"],["Week","week"],["Format","format"],["Title","title"],["Pillar","pillar"],["Platforms","platforms"],["CTA","cta"],["Reference link","link"],["Notes","notes"]]
      .forEach(([label,k])=>{ if(col[k]>=0) mapping[label]=H[col[k]]; });
    statusCols.forEach(i=>mapping[H[i]]=H[i]);
    return {name:name||"Campaign",year,columns:H,mapping,unused:H.filter((h,i)=>h&&!used.has(i)),items,weeks};
  }

  const monthKey=d=>d.slice(0,7);
  const monthLabel=k=>{ const [y,m]=k.split("-"); return new Date(Date.UTC(+y,+m-1,1)).toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"}); };

  const FORMAT_ICON=f=>/reel|video|short/i.test(f)?"▶":/carousel/i.test(f)?"▦":/story/i.test(f)?"◔":/static|photo|post|image/i.test(f)?"■":"•";
  const STATE_LABEL={done:"Posted",ready:"Ready",todo:"To do",blocked:"Blocked","":"No status"};

  const todayIso=()=>new Date(Date.now()+4*3600e3).toISOString().slice(0,10);

  function pickMonth(c,want){
    const ks=[...new Set(c.items.map(i=>monthKey(i.date)))].sort();
    if(want&&ks.includes(want)) return {ks,k:want};
    const t=todayIso().slice(0,7); return {ks,k:ks.includes(t)?t:(ks.find(k=>k>t)||ks[ks.length-1])};
  }
  function filtered(c,ui,k){
    return c.items.filter(i=>monthKey(i.date)===k&&(!ui.fmt||i.format===ui.fmt)&&(!ui.plat||i.platforms.includes(ui.plat))&&(!ui.state||i.state===ui.state));
  }

  function render(el,c,ui){

const fmtWhen=iso=>{ if(!iso) return "No time set"; const d=new Date(iso+":00Z"); return isNaN(d)?iso:d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"UTC"}); };

function packList(){ const all=visible().slice().sort((a,b)=>(a.scheduledAt||"").localeCompare(b.scheduledAt||"")); return week==="all"?all:all.filter(p=>weekKey(p.scheduledAt)===week); }

        ${filled?`<div class="copybox">${k==="youtube"&&C.title?`<span class="seg">Title</span>${esc(C.title)}\n\n`:""}${C.hook?`<span class="seg">Hook</span>${esc(C.hook)}\n\n`:""}${C.body?`<span class="seg">Body</span>${esc(C.body)}\n\n`:""}${C.cta?`<span class="seg">CTA</span>${esc(C.cta)}`:""}${C.hashtags?`\n\n<span class="tags">${esc(C.hashtags)}</span>`:""}</div>`:`<p class="sub">Not written yet.</p>`}</div>`; }).join("");
    return `<article class="creative" id="cr-${esc(p.id)}"><div class="cr-top">${p.thumb?`<img src="${esc(p.thumb)}" alt="${esc(p.altText||"")}" loading="lazy">`:`<div class="noimg"></div>`}
      <div><span class="eyebrow">Creative ${String(i+1).padStart(2,"0")} · ${p.kind==="video"?"Video":"Photo"}</span><div class="cr-title">${esc(titleOf(p))}</div>
      <div class="pills"><span class="pill ${esc(p.status)}">${STATUS_ICON[p.status]||""} ${esc(STATUS_LABEL[p.status]||p.status)}</span><span class="pill">${esc(fmtWhen(p.scheduledAt))}</span></div>
      ${on.length?`<div class="cr-prog"><div class="meter"><div style="width:${Math.round(dn/on.length*100)}%"></div></div>${dn} of ${on.length} platform${on.length===1?"":"s"} done</div>`:""}
      ${p.strategy?`<p class="strategy">${esc(p.strategy)}</p>`:""}
      <dl class="kv">${p.keyword?`<dt>Keyword</dt><dd>${esc(p.keyword)}</dd>`:""}${p.specialist?`<dt>Specialist</dt><dd>${esc(p.specialist)} ${esc(p.handle)}</dd>`:""}<dt>Branch</dt><dd>${esc(p.branch||"All salons")}</dd>${p.onScreen?`<dt>On-screen</dt><dd>${esc(p.onScreen)}</dd>`:""}${p.altText?`<dt>Alt text</dt><dd>${esc(p.altText)}</dd>`:""}</dl></div></div>${plats}</article>`;
  }).join("")+`</div>
  <div class="footer-card" style="margin-top:18px">
    <div><h4>Posting notes</h4><p>Instagram: hook first line, save prompt last line before hashtags, alt text in advanced settings. Facebook: link in comments for reach, no hashtags in the first 2 lines. TikTok: on-screen text burned in, captions lowercase as written. Google Business: post each branch separately.</p></div>
    <div><h4>AEO</h4><p>Each asset answers the implied question in the first 40 words, with the question in the hook.</p></div>
    <div><h4>GEO</h4><p>Specialist name, role, Tara Rose Salon, branch and city on every platform. Expertise shown through the method, not claims.</p></div>
    <div><h4>Local</h4><p>${esc(branches().join(", "))} · ${esc(data.hours||"")}</p></div>
  </div>`;
  $("#pack").querySelectorAll(".cp").forEach(b=>b.onclick=()=>{ const p=data.posts.find(x=>x.id===b.dataset.id), k=b.dataset.k, C=capOf(p,k);
    copy(k==="gbp"?`${C.posts[+b.dataset.j].title}\n\n${C.posts[+b.dataset.j].body}`:fullText(k,C),b); });
}
let campSel="", campUi={view:"table",month:"",fmt:"",plat:"",state:"",canImport:false,onChange:()=>renderCamp()};
function renderCamp(){
  const cs=(data.campaigns||[]).slice().sort((a,b)=>String(b.importedAt||"").localeCompare(String(a.importedAt||"")));
  const c=cs.find(x=>x.id===campSel)||cs[0]||null; if(c) campSel=c.id;
  $("#campSel").innerHTML=cs.length?cs.map(x=>`<option value="${esc(x.id)}" ${x.id===campSel?"selected":""}>${esc(x.name)} (${x.items.length} posts)</option>`).join(""):"<option>No campaigns yet</option>";
  $("#campSel").disabled=!cs.length;
  CAMP.render($("#camp"),c,campUi);
}
function setView(v){ view=v; $("#vGrid").setAttribute("aria-pressed",v==="grid"); $("#vPack").setAttribute("aria-pressed",v==="pack"); $("#vCamp").setAttribute("aria-pressed",v==="campaign");
  $("#gridView").hidden=v!=="grid"; $("#packView").hidden=v!=="pack"; $("#campView").hidden=v!=="campaign"; $("#pipeline").hidden=v==="campaign"; render(); }
function render(){ renderPipeline(); if(view==="grid") renderGrid(); else if(view==="pack") renderPack(); else renderCamp(); }
$("#vGrid").onclick=()=>setView("grid"); $("#vPack").onclick=()=>setView("pack"); $("#vCamp").onclick=()=>setView("campaign");
$("#campSel").onchange=()=>{campSel=$("#campSel").value;campUi.month="";renderCamp();};
$("#weekSel").onchange=()=>{week=$("#weekSel").value;renderPack();};
$("#packCopy").onclick=()=>copy(packPlain(packList()),$("#packCopy"));

function startWith(d,note){
  data=d; data.posts=(d.posts||[]).filter(p=>p.status!=="hidden");
  const t=new Date(d.exportedAt); $("#updated").textContent=(isNaN(t)?"Read-only view of the plan":`Plan last updated ${t.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Dubai"})} (Dubai)`)+(note||"");
  render();
}
function builtIn(){ try{ return JSON.parse(document.getElementById("planData").textContent); }catch{ return null; } }
/* Load the latest data/posts.json; if the page was opened as a file or the data file is missing, use the copy built into this page. */
fetch("data/posts.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>startWith(d,""))
  .catch(()=>{ const d=builtIn(); if(d) startWith(d," · built-in copy"); else { $("#updated").textContent="The plan could not be loaded."; render(); } });
</script>
</body>
